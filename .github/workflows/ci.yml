name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - name: noelle preloads every skill
        run: |
          missing=0
          for d in skills/*/; do
            s=$(basename "$d")
            grep -qx "  - $s" agents/noelle.md || { echo "::error::noelle.md doesn't preload skill $s"; missing=1; }
          done
          exit $missing
